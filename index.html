<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Quizzes Escolares</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 650px; box-sizing: border-box; }
        h2 { color: #2d3436; text-align: center; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #636e72; font-size: 14px; }
        input, select, textarea, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #dfe6e9; font-size: 15px; box-sizing: border-box; }
        textarea { resize: vertical; height: 180px; font-family: monospace; font-size: 13px; }
        button { background: #0984e3; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 20px; transition: background 0.3s; }
        button:hover { background: #74b9ff; }
        .btn-secundario { background: #636e72; }
        .btn-secundario:hover { background: #b2bec3; }
        .opcao-btn { background: #f1f2f6; color: #2d3436; border: 1px solid #dfe6e9; text-align: left; margin-top: 10px; cursor: pointer; }
        .opcao-btn:hover { background: #dfe6e9; }
        .resultado-box { text-align: center; font-size: 18px; font-weight: bold; margin: 20px 0; color: #00b894; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #dfe6e9; padding: 8px; text-align: left; }
        th { background: #f1f2f6; }
        .menu-topo { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px; }
        .menu-topo button { margin-top: 0; font-size: 13px; padding: 8px; flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="menu-topo">
        <button onclick="irParaHome()">🏠 Portal Principal</button>
        <button class="btn-secundario" onclick="carregarPainelProfessor()">👨‍🏫 Área do Professor</button>
    </div>

    <div id="app"></div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygDr0aqN6zZp1h-yWYmhqE8IFTfWF8iroDT1DBILT7FEC5kwXZ8zPLhKlOENC7plCiSA/exec";

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('id');
        if (quizId) {
            iniciarTelaAluno(quizId);
        } else {
            irParaHome();
        }
    };

    function irParaHome() {
        document.getElementById('app').innerHTML = `
            <h2>Portal de Quizzes</h2>
            <p style="text-align: center; color: #636e72;">Bem-vindo! Utilize os botões acima ou abra o link enviado pelo seu professor.</p>
            <button onclick="carregarPainelProfessor()">Acessar Painel do Professor</button>
        `;
    }

    // --- ÁREA DO PROFESSOR ---
    function carregarPainelProfessor() {
        document.getElementById('app').innerHTML = `
            <h2>Painel do Professor</h2>
            <button onclick="telaCriarQuiz()">➕ Criar Novo Quiz com o Texto Completo</button>
            <button class="btn-secundario" onclick="carregarResultadosAlunos()">📊 Ver Notas dos Alunos</button>
        `;
    }

    function telaCriarQuiz() {
        document.getElementById('app').innerHTML = `
            <h2>Criar Novo Quiz</h2>
            <label>Tema do Quiz:</label>
            <input type="text" id="temaQuiz" value="Socialismo e Comunismo - 8º Ano">
            
            <label>Cole o Texto Completo (Questões + Gabarito no final):</label>
            <textarea id="textoBruto" placeholder="Cole aqui o seu texto completo com as 30 questões e o gabarito..."></textarea>
            
            <button onclick="processarECriarQuiz()">Processar e Salvar na Planilha</button>
            <button class="btn-secundario" onclick="carregarPainelProfessor()">Voltar</button>
        `;
    }

    // Processamento inteligente do texto colado pelo professor
    function processarECriarQuiz() {
        const tema = document.getElementById('temaQuiz').value;
        const texto = document.getElementById('textoBruto').value;

        if (!tema || !texto) {
            alert("Preencha o tema e cole o texto.");
            return;
        }

        try {
            // 1. Extrair o gabarito do texto (procura por "Gabarito:" ou similar no final)
            let gabaritoMap = {};
            let matchGabarito = texto.match(/Gabarito.*?:\s*([^\n]+)/is);
            if (matchGabarito) {
                let gabaritoStr = matchGabarito[1];
                let pares = gabaritoStr.split('|');
                pares.forEach(par => {
                    let partes = par.trim().split('-');
                    if (partes.length === 2) {
                        let numQ = partes[0].trim();
                        let letraQ = partes[1].trim().toUpperCase();
                        let indexLetra = {'A':0, 'B':1, 'C':2, 'D':3}[letraQ] || 0;
                        gabaritoMap[numQ] = indexLetra;
                    }
                });
            }

            // 2. Separar as questões por número (ex: "1.", "2.", etc.)
            let questoesGeradas = [];
            let blocos = texto.split(/\n\s*(?=\d+\.\s)/);

            blocos.forEach(bloco => {
                let linhas = bloco.split('\n').map(l => l.trim()).filter(l => l);
                if (linhas.length >= 5) {
                    let matchNum = linhas[0].match(/^(\d+)\./);
                    if (matchNum) {
                        let numQ = matchNum[1];
                        let pergunta = linhas[0].replace(/^\d+\.\s*/, '');
                        let opcoes = [];
                        let correta = gabaritoMap[numQ] || 0; // Pega do gabarito ou 0 se não achar

                        for (let i = 1; i < linhas.length; i++) {
                            if (/^[A-D]\)/i.test(linhas[i])) {
                                opcoes.push(linhas[i].replace(/^[A-D]\)\s*/i, ''));
                            }
                        }

                        if (opcoes.length >= 4) {
                            questoesGeradas.push({
                                pergunta: pergunta,
                                opcoes: opcoes.slice(0, 4),
                                correta: correta
                            });
                        }
                    }
                }
            });

            if (questoesGeradas.length === 0) {
                alert("Não foi possível extrair as questões automaticamente. Verifique se o formato contém '1. Pergunta', 'A)...' e o 'Gabarito:' no final.");
                return;
            }

            document.getElementById('app').innerHTML = `<h2>Salvando ${questoesGeradas.length} questões na planilha... ⏳</h2>`;

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ acao: "criar_quiz", tema: tema, questoes: questoesGeradas })
            }).then(() => {
                const linkAluno = window.location.origin + window.location.pathname + "?id=quiz_" + Date.now();
                document.getElementById('app').innerHTML = `
                    <h2>Quiz Criado com Sucesso! 🎉</h2>
                    <p>Foram importadas <b>${questoesGeradas.length} questões</b>.</p>
                    <p>Copie o link abaixo e envie para os seus alunos:</p>
                    <input type="text" value="${linkAluno}" readonly onclick="this.select()">
                    <button onclick="carregarPainelProfessor()">Voltar ao Painel</button>
                `;
            });

        } catch (e) {
            alert("Erro ao processar o texto: " + e.message);
        }
    }

    function carregarResultadosAlunos() {
        document.getElementById('app').innerHTML = `<h2>Carregando notas... ⏳</h2>`;
        
        fetch(SCRIPT_URL + "?acao=buscar_resultados")
        .then(res => res.json())
        .then(dados => {
            let html = `<h2>Notas dos Alunos</h2>`;
            if (!dados || dados.length === 0) {
                html += `<p style="text-align:center; color:#636e72;">Nenhuma resposta registrada ainda.</p>`;
            } else {
                html += `<table><tr><th>Data</th><th>Tema</th><th>Aluno</th><th>Nota</th></tr>`;
                dados.reverse().forEach(row => {
                    html += `<tr><td>${new Date(row.data).toLocaleDateString()}</td><td>${row.tema}</td><td>${row.aluno}</td><td><b>${row.acertos}/${row.total}</b></td></tr>`;
                });
                html += `</table>`;
            }
            html += `<br><button class="btn-secundario" onclick="carregarPainelProfessor()">Voltar</button>`;
            document.getElementById('app').innerHTML = html;
        });
    }

    // --- ÁREA DO ALUNO ---
    let quizAtual = {};
    let indiceQuestaoAtual = 0;
    let acertosAluno = 0;

    function iniciarTelaAluno(quizId) {
        document.getElementById('app').innerHTML = `<h2>Carregando Quiz... ⏳</h2>`;

        fetch(SCRIPT_URL + `?acao=buscar_quiz&id=${quizId}`)
        .then(res => res.json())
        .then(data => {
            if (!data.questoes || data.questoes.length === 0) {
                document.getElementById('app').innerHTML = `<h2>Quiz não encontrado ou expirado.</h2>`;
                return;
            }
            quizAtual = data;
            indiceQuestaoAtual = 0;
            acertosAluno = 0;
            mostrarPerguntaAluno();
        });
    }

    function mostrarPerguntaAluno() {
        const q = quizAtual.questoes[indiceQuestaoAtual];
        let html = `
            <h3>Tema: ${quizAtual.tema}</h3>
            <p><b>Questão ${indiceQuestaoAtual + 1} de ${quizAtual.questoes.length}</b></p>
            <p style="font-size: 16px; font-weight: 500;">${q.pergunta}</p>
        `;

        q.opcoes.forEach((opcao, index) => {
            html += `<button class="opcao-btn" onclick="selecionarOpcao(${index})">${String.fromCharCode(65 + index)}) ${opcao}</button>`;
        });

        document.getElementById('app').innerHTML = html;
    }

    function selecionarOpcao(index) {
        const q = quizAtual.questoes[indiceQuestaoAtual];
        const acertou = (index === q.correta);
        if (acertou) acertosAluno++;

        indiceQuestaoAtual++;
        if (indiceQuestaoAtual < quizAtual.questoes.length) {
            mostrarPerguntaAluno();
        } else {
            finalizarQuizAluno();
        }
    }

    function finalizarQuizAluno() {
        const total = quizAtual.questoes.length;
        
        document.getElementById('app').innerHTML = `
            <h2>Quiz Finalizado! 🎯</h2>
            <p class="resultado-box">Você acertou ${acertosAluno} de ${total} questões!</p>
            <label>Digite seu nome completo para registrar sua nota:</label>
            <input type="text" id="nomeAlunoFinal" placeholder="Seu Nome Completo">
            <button onclick="enviarNotaFinal('${quizAtual.tema}', ${acertosAluno}, ${total})">Enviar Nota</button>
        `;
    }

    function enviarNotaFinal(tema, acertos, total) {
        const nome = document.getElementById('nomeAlunoFinal').value.trim();
        if (!nome) {
            alert("Por favor, digite seu nome!");
            return;
        }

        document.getElementById('app').innerHTML = `<h2>Enviando resultado... ⏳</h2>`;

        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                acao: "salvar_resposta",
                tema: tema,
                aluno: nome,
                acertos: acertos,
                total: total
            })
        }).then(() => {
            document.getElementById('app').innerHTML = `
                <h2>Parabéns, ${nome}! 🏆</h2>
                <p class="resultado-box">Sua nota (${acertos}/${total}) foi salva com sucesso na planilha do professor!</p>
                <button onclick="location.href = location.pathname">Responder Outro Quiz</button>
            `;
        });
    }
</script>

</body>
</html>
