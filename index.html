<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Plataforma de Quizzes</title>


<style>

body {

    font-family: 'Segoe UI',
                 Tahoma,
                 Geneva,
                 Verdana,
                 sans-serif;

    background: #f4f7f6;

    margin: 0;

    padding: 20px;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 100vh;

}


.container {

    background: white;

    padding: 30px;

    border-radius: 12px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.1);

    width: 100%;

    max-width: 650px;

    box-sizing: border-box;

}


h2 {

    color: #2d3436;

    text-align: center;

    margin-top: 0;

}


h3 {

    color: #2d3436;

}


label {

    display: block;

    margin-top: 15px;

    font-weight: bold;

    color: #636e72;

    font-size: 14px;

}


input,
textarea,
button {

    width: 100%;

    padding: 12px;

    margin-top: 5px;

    border-radius: 6px;

    border: 1px solid #dfe6e9;

    font-size: 15px;

    box-sizing: border-box;

}


textarea {

    resize: vertical;

    height: 180px;

    font-family: monospace;

    font-size: 13px;

}


button {

    background: #0984e3;

    color: white;

    border: none;

    cursor: pointer;

    font-weight: bold;

    margin-top: 20px;

}


button:hover {

    background: #74b9ff;

}


button:disabled {

    background: #b2bec3;

    cursor: not-allowed;

}


.btn-secundario {

    background: #636e72;

}


.opcao-btn {

    background: #f1f2f6;

    color: #2d3436;

    border: 1px solid #dfe6e9;

    text-align: left;

    margin-top: 10px;

}


.resultado-box {

    text-align: center;

    font-size: 20px;

    font-weight: bold;

    margin: 20px 0;

    color: #00b894;

}


table {

    width: 100%;

    border-collapse: collapse;

    margin-top: 15px;

    font-size: 14px;

}


th,
td {

    border: 1px solid #dfe6e9;

    padding: 8px;

    text-align: left;

}


th {

    background: #f1f2f6;

}


.menu-topo {

    display: flex;

    gap: 10px;

    margin-bottom: 20px;

    border-bottom: 2px solid #f1f2f6;

    padding-bottom: 10px;

}


.menu-topo button {

    margin-top: 0;

    font-size: 13px;

    padding: 8px;

    flex: 1;

}


.progresso {

    text-align: center;

    color: #636e72;

    margin-bottom: 15px;

}


</style>

</head>


<body>


<div class="container">


<div class="menu-topo">

<button onclick="irParaHome()">
🏠 Portal Principal
</button>


<button class="btn-secundario"
        onclick="carregarPainelProfessor()">

👨‍🏫 Área do Professor

</button>

</div>


<div id="app"></div>


</div>


<script>


// ============================================================
// CONFIGURAÇÃO
// ============================================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzPyTUQNzWyS0dH947JJKZWxLxPlkYYIojoiDmlqbJ4mTc40-GXjttydl3EVZfiadRjEQ/exec";


// ============================================================
// VARIÁVEIS DO ALUNO
// ============================================================

let quizAtual = {};

let nomeAlunoGlobal = "";

let indiceQuestaoAtual = 0;

let acertosAluno = 0;

let respostasAluno = [];

let quizFinalizado = false;


// ============================================================
// INICIALIZAÇÃO
// ============================================================

window.onload = function() {

    const parametros =
        new URLSearchParams(window.location.search);


    const quizId =
        parametros.get("id");


    if (quizId) {

        prepararIdentificacaoAluno(quizId);

    } else {

        irParaHome();

    }

};


// ============================================================
// HOME
// ============================================================

function irParaHome() {

    document.getElementById("app").innerHTML = `

        <h2>Portal de Quizzes</h2>

        <p style="text-align:center;color:#636e72">

        Bem-vindo!

        </p>

        <button onclick="carregarPainelProfessor()">

        Acessar Painel do Professor

        </button>

    `;

}


// ============================================================
// PAINEL PROFESSOR
// ============================================================

function carregarPainelProfessor() {

    document.getElementById("app").innerHTML = `

        <h2>Painel do Professor</h2>

        <button onclick="telaCriarQuiz()">

        ➕ Criar Novo Quiz

        </button>


        <button class="btn-secundario"
                onclick="carregarResultadosAlunos()">

        📊 Ver Notas dos Alunos

        </button>

    `;

}


// ============================================================
// CRIAR QUIZ
// ============================================================

function telaCriarQuiz() {

    document.getElementById("app").innerHTML = `

        <h2>Criar Novo Quiz</h2>


        <label>Tema do Quiz:</label>

        <input
            type="text"
            id="temaQuiz"
            value="Socialismo e Comunismo - 8º Ano"
        >


        <label>

        Cole o Texto Completo:

        </label>


        <textarea
            id="textoBruto"
            placeholder="Cole aqui as questões e o gabarito..."
        ></textarea>


        <button onclick="processarECriarQuiz()">

        Processar e Salvar

        </button>


        <button
            class="btn-secundario"
            onclick="carregarPainelProfessor()">

        Voltar

        </button>

    `;

}


// ============================================================
// PROCESSAR QUIZ
// ============================================================

function processarECriarQuiz() {

    const tema =
        document.getElementById("temaQuiz").value.trim();


    const texto =
        document.getElementById("textoBruto").value.trim();


    if (!tema || !texto) {

        alert("Preencha o tema e cole o texto.");

        return;

    }


    try {


        // ------------------------------------------------------
        // GABARITO
        // ------------------------------------------------------

        let gabaritoMap = {};


        let matchGabarito =
            texto.match(/Gabarito.*?:\s*([^\n]+)/is);


        if (matchGabarito) {

            let gabaritoStr =
                matchGabarito[1];


            let pares =
                gabaritoStr.split("|");


            pares.forEach(function(par) {

                let partes =
                    par.trim().split("-");


                if (partes.length === 2) {

                    let num =
                        partes[0].trim();


                    let letra =
                        partes[1].trim().toUpperCase();


                    let mapa = {

                        A: 0,

                        B: 1,

                        C: 2,

                        D: 3

                    };


                    if (mapa[letra] !== undefined) {

                        gabaritoMap[num] =
                            mapa[letra];

                    }

                }

            });

        }


        // ------------------------------------------------------
        // QUESTÕES
        // ------------------------------------------------------

        let questoesGeradas = [];


        let blocos =
            texto.split(/\n\s*(?=\d+\.\s)/);


        blocos.forEach(function(bloco) {


            let linhas =
                bloco
                .split("\n")
                .map(function(l) {
                    return l.trim();
                })
                .filter(function(l) {
                    return l;
                });


            if (linhas.length >= 5) {


                let matchNum =
                    linhas[0].match(/^(\d+)\./);


                if (!matchNum) {
                    return;
                }


                let numQ =
                    matchNum[1];


                let pergunta =
                    linhas[0]
                    .replace(/^\d+\.\s*/, "");


                let opcoes = [];


                for (
                    let i = 1;
                    i < linhas.length;
                    i++
                ) {


                    if (/^[A-D]\)/i.test(linhas[i])) {

                        opcoes.push(

                            linhas[i]
                            .replace(
                                /^[A-D]\)\s*/i,
                                ""
                            )

                        );

                    }

                }


                if (opcoes.length >= 4) {


                    if (
                        gabaritoMap[numQ] === undefined
                    ) {

                        alert(
                            "Não foi encontrado o gabarito da questão " +
                            numQ
                        );

                        return;

                    }


                    questoesGeradas.push({

                        pergunta: pergunta,

                        opcoes: opcoes.slice(0,4),

                        correta:
                            gabaritoMap[numQ]

                    });

                }

            }

        });


        if (questoesGeradas.length === 0) {

            alert(
                "Não foi possível extrair as questões."
            );

            return;

        }


        // ------------------------------------------------------
        // ID ÚNICO
        // ------------------------------------------------------

        const quizId =
            "quiz_" +
            Date.now() +
            "_" +
            Math.floor(Math.random() * 1000);


        document.getElementById("app").innerHTML = `

            <h2>

            Salvando ${questoesGeradas.length}
            questões...

            ⏳

            </h2>

        `;


        // ------------------------------------------------------
        // ENVIO
        // ------------------------------------------------------

        fetch(SCRIPT_URL, {

            method: "POST",

            mode: "no-cors",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body: JSON.stringify({

                acao: "criar_quiz",

                id: quizId,

                tema: tema,

                questoes:
                    questoesGeradas

            })

        })


        .then(function() {


            // --------------------------------------------------
            // MESMO ID QUE FOI SALVO
            // --------------------------------------------------

            const linkAluno =
                window.location.origin +
                window.location.pathname +
                "?id=" +
                encodeURIComponent(quizId);


            document.getElementById("app").innerHTML = `

                <h2>

                Quiz Criado com Sucesso! 🎉

                </h2>


                <p>

                Foram importadas

                <b>
                ${questoesGeradas.length}
                questões
                </b>.

                </p>


                <p>

                Envie este link aos alunos:

                </p>


                <input
                    type="text"
                    value="${linkAluno}"
                    readonly
                    onclick="this.select()"
                >


                <button
                    onclick="navigator.clipboard.writeText('${linkAluno}')">

                    📋 Copiar Link

                </button>


                <button
                    class="btn-secundario"
                    onclick="carregarPainelProfessor()">

                    Voltar ao Painel

                </button>

            `;

        })


        .catch(function(erro) {

            alert(
                "Erro ao enviar o quiz: " +
                erro.message
            );

        });


    } catch (erro) {

        alert(
            "Erro ao processar o texto: " +
            erro.message
        );

    }

}


// ============================================================
// IDENTIFICAÇÃO DO ALUNO
// ============================================================

function prepararIdentificacaoAluno(quizId) {

    document.getElementById("app").innerHTML = `

        <h2>

        Identificação do Aluno 📝

        </h2>


        <p style="text-align:center;color:#636e72">

        Informe seu nome completo para iniciar.

        </p>


        <label>

        Nome Completo:

        </label>


        <input
            type="text"
            id="nomeAlunoInput"
            placeholder="Digite seu nome..."
        >


        <button
            onclick="iniciarQuiz('${quizId}')">

            Começar Quiz

        </button>

    `;

}


// ============================================================
// INICIAR QUIZ
// ============================================================

function iniciarQuiz(quizId) {

    const nomeInput =
        document.getElementById("nomeAlunoInput");


    nomeAlunoGlobal =
        nomeInput.value.trim();


    if (!nomeAlunoGlobal) {

        alert(
            "Digite seu nome completo."
        );

        return;

    }


    document.getElementById("app").innerHTML = `

        <h2>

        Carregando Quiz...

        ⏳

        </h2>

    `;


    fetch(

        SCRIPT_URL +
        "?acao=buscar_quiz&id=" +
        encodeURIComponent(quizId)

    )


    .then(function(res) {

        return res.json();

    })


    .then(function(data) {


        if (
            data.status === "erro" ||
            !data.questoes ||
            data.questoes.length === 0
        ) {


            document.getElementById("app").innerHTML = `

                <h2>

                Quiz não encontrado.

                </h2>


                <p style="text-align:center">

                Verifique se o link está correto.

                </p>

            `;


            return;

        }


        quizAtual = data;


        indiceQuestaoAtual = 0;

        acertosAluno = 0;

        respostasAluno = [];

        quizFinalizado = false;


        mostrarPerguntaAluno();

    })


    .catch(function(erro) {

        document.getElementById("app").innerHTML = `

            <h2>

            Erro ao carregar o quiz.

            </h2>


            <p>

            ${erro.message}

            </p>

        `;

    });

}


// ============================================================
// MOSTRAR QUESTÃO
// ============================================================

function mostrarPerguntaAluno() {

    if (quizFinalizado) {
        return;
    }


    const q =
        quizAtual.questoes[indiceQuestaoAtual];


    let html = `


        <h3>

        ${quizAtual.tema}

        </h3>


        <p>

        <b>Aluno(a):</b>
        ${nomeAlunoGlobal}

        </p>


        <div class="progresso">

        Questão

        ${indiceQuestaoAtual + 1}

        de

        ${quizAtual.questoes.length}

        </div>


        <p style="font-size:17px;font-weight:500">

        ${q.pergunta}

        </p>

    `;


    q.opcoes.forEach(function(opcao, index) {


        html += `

            <button
                class="opcao-btn"
                onclick="selecionarOpcao(${index})">

                ${String.fromCharCode(65 + index)})
                ${opcao}

            </button>

        `;

    });


    document.getElementById("app").innerHTML =
        html;

}


// ============================================================
// SELECIONAR RESPOSTA
// ============================================================

function selecionarOpcao(index) {

    if (quizFinalizado) {
        return;
    }


    const q =
        quizAtual.questoes[indiceQuestaoAtual];


    // Guarda a resposta

    respostasAluno.push({

        questao:
            indiceQuestaoAtual + 1,

        resposta:
            String.fromCharCode(65 + index)

    });


    // Verifica acerto

    if (index === q.correta) {

        acertosAluno++;

    }


    // Próxima questão

    indiceQuestaoAtual++;


    if (
        indiceQuestaoAtual <
        quizAtual.questoes.length
    ) {


        mostrarPerguntaAluno();


    } else {


        finalizarQuiz();

    }

}


// ============================================================
// FINALIZAR
// ============================================================

function finalizarQuiz() {

    if (quizFinalizado) {
        return;
    }


    quizFinalizado = true;


    const total =
        quizAtual.questoes.length;


    // --------------------------------------------------------
    // Transformar respostas em texto
    // --------------------------------------------------------

    const respostasTexto =
        respostasAluno
        .map(function(r) {

            return r.questao +
                   ":" +
                   r.resposta;

        })
        .join(", ");


    document.getElementById("app").innerHTML = `

        <h2>

        Enviando resultado...

        ⏳

        </h2>

    `;


    // --------------------------------------------------------
    // SALVAR
    // --------------------------------------------------------

    fetch(SCRIPT_URL, {

        method: "POST",

        mode: "no-cors",

        headers: {

            "Content-Type":
                "text/plain;charset=utf-8"

        },

        body: JSON.stringify({

            acao: "salvar_resposta",

            id: obterIdQuiz(),

            tema: quizAtual.tema,

            aluno: nomeAlunoGlobal,

            acertos: acertosAluno,

            total: total,

            respostas: respostasTexto

        })

    })


    .then(function() {


        const percentual =
            Math.round(
                (acertosAluno / total) * 100
            );


        document.getElementById("app").innerHTML = `

            <h2>

            Quiz concluído! 🎉

            </h2>


            <p class="resultado-box">

            ${acertosAluno}

            de

            ${total}

            questões corretas

            <br>

            ${percentual}%

            </p>


            <p style="text-align:center;color:#636e72">

            Seu resultado foi enviado ao professor.

            </p>

        `;

    })


    .catch(function(erro) {

        document.getElementById("app").innerHTML = `

            <h2>

            Não foi possível enviar o resultado.

            </h2>


            <p>

            ${erro.message}

            </p>

        `;

    });

}


// ============================================================
// OBTER ID DO QUIZ
// ============================================================

function obterIdQuiz() {

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    return parametros.get("id") || "";

}


// ============================================================
// RESULTADOS
// ============================================================

function carregarResultadosAlunos() {

    document.getElementById("app").innerHTML = `

        <h2>

        Carregando notas...

        ⏳

        </h2>

    `;


    fetch(

        SCRIPT_URL +
        "?acao=buscar_resultados"

    )


    .then(function(res) {

        return res.json();

    })


    .then(function(dados) {


        let html = `

            <h2>

            Notas dos Alunos

            </h2>

        `;


        if (
            !dados ||
            dados.length === 0
        ) {


            html += `

                <p style="text-align:center">

                Nenhuma resposta registrada.

                </p>

            `;


        } else {


            html += `

                <table>

                <tr>

                <th>Data</th>

                <th>Aluno</th>

                <th>Quiz</th>

                <th>Nota</th>

                </tr>

            `;


            dados.reverse().forEach(function(row) {


                html += `

                    <tr>

                    <td>

                    ${new Date(row.data)
                        .toLocaleDateString("pt-BR")}

                    </td>


                    <td>

                    ${row.aluno}

                    </td>


                    <td>

                    ${row.tema}

                    </td>


                    <td>

                    <b>

                    ${row.acertos}/${row.total}

                    </b>

                    <br>

                    ${Math.round(
                        Number(row.percentual) * 100
                    )}%

                    </td>

                    </tr>

                `;

            });


            html += `

                </table>

            `;

        }


        html += `

            <button
                class="btn-secundario"
                onclick="carregarPainelProfessor()">

                Voltar

            </button>

        `;


        document.getElementById("app").innerHTML =
            html;

    });


}


</script>

</body>

</html>
