<script>
    // Sua URL oficial do Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyAj2wq3utzTMCj_9fHcY-l5nyXVLUhYCLb67W-TZDtXXk3468fyp5q9K9u9LkVyXT1Cw/exec";

    function iniciarQuiz() {
        const nome = document.getElementById('nomeAluno').value.trim();
        const tema = document.getElementById('selectTema').value;

        if (!nome) {
            alert("Por favor, digite seu nome!");
            return;
        }

        // Exemplo de pontuação (substitua pelas variáveis reais do seu quiz)
        const acertosFicticios = Math.floor(Math.random() * 5) + 6; 
        const totalPerguntas = 10;

        const dadosEnvio = {
            tema: tema,
            aluno: nome,
            acertos: acertosFicticios,
            total: totalPerguntas,
            status: "Finalizado"
        };

        // Usamos URLSearchParams para enviar como formulário, contornando restrições rígidas de CORS do Google
        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8",
            },
            body: JSON.stringify(dadosEnvio)
        })
        .then(() => {
            // Como o no-cors oculta o retorno, exibimos a tela de sucesso imediatamente
            document.getElementById('app').innerHTML = `
                <h2>Quiz Concluído, ${nome}!</h2>
                <p>Tema: <b>${tema}</b></p>
                <p>Você acertou ${acertosFicticios} de ${totalPerguntas} perguntas.</p>
                <p style="color: green; font-weight: bold;">Respostas enviadas para a planilha!</p>
            `;
        })
        .catch(err => {
            console.error("Erro na requisição:", err);
            alert("Houve um problema de conexão ao enviar os dados.");
        });
    }
</script>
